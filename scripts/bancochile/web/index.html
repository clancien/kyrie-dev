<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Banco Chile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20261007-logo" />
  </head>
  <body>
    <div class="bg-layer"></div>
    <div class="container">
      <header class="hero">
        <div class="brand">
          <img class="brand-logo" src="./assets/banco-chile.svg?v=20261007-normalized" alt="Banco de Chile" width="148" height="30" />
          <h1>Panel Banco Chile</h1>
        </div>
        <button id="updateBtn" class="btn" type="button">Actualizar</button>
      </header>
      <p id="updateStatus" class="update-status" role="status" aria-live="polite" hidden></p>

      <div class="dashboard-layout">
        <aside class="sidebar" aria-label="Productos bancarios">
          <nav aria-label="Cuentas y tarjetas">
            <h2 class="menu-heading">Cuentas</h2>
            <div id="accounts" class="product-menu"></div>
            <h2 class="menu-heading">Tarjetas</h2>
            <div id="cards" class="product-menu"></div>
          </nav>
        </aside>
        <main class="panel movements-panel">
        <div class="section-head">
          <h2>Movimientos acumulados</h2>
          <div class="movement-filters">
            <select id="movementsMonthFrom" class="input-select" aria-label="Mes desde">
              <option value="">Desde: todos</option>
            </select>
            <select id="movementsMonthTo" class="input-select" aria-label="Mes hasta">
              <option value="">Hasta: todos</option>
            </select>
            <select id="movementsType" class="input-select">
              <option value="">Todos los tipos</option>
              <option value="cargo">Cargo</option>
              <option value="abono">Abono</option>
            </select>
            <button id="downloadMovementsCsv" class="btn-download" type="button" disabled>Descargar CSV</button>
          </div>
        </div>
        <div class="text-filters-head">
          <span>Filtros de texto <small>(se aplican todos)</small></span>
          <button id="addTextFilter" class="btn-add-filter" type="button">Agregar filtro</button>
        </div>
        <div id="textFilters" class="text-filters"></div>
        <div id="movementsByAccount"></div>
        </main>
      </div>
    </div>

    <template id="emptyStateTpl">
      <div class="empty">Sin datos para mostrar.</div>
    </template>

    <script type="module" src="./app.js?v=20261007-update"></script>
  </body>
</html>
