<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentación</title>
<style>
:root{
  --bg:#12151a; --bg-alt:#171b22; --bg-soft:#1d222b; --border:#2a313d;
  --fg:#dde3ec; --fg-dim:#95a1b3; --fg-mute:#6b788c;
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.14); --accent-2:#7dd3fc;
  --warn:#fbbf24; --ok:#34d399; --danger:#f87171;
  --code-bg:#0f1319; --mark:#fde68a; --mark-fg:#1b1b1b;
  /* graficos: par validado (OKLab, CVD protan/deutan) sobre superficie --bg-alt */
  --c-done:#16a34a; --c-review:#0891b2;
  /* etapas pendientes: rampa neutra ordinal, del menos al mas avanzado */
  --c-p1:#4b5563; --c-p2:#6b788c; --c-p3:#95a1b3;
  --sidebar-w:290px; --toc-w:220px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg-alt:#ffffff; --bg-soft:#eef1f5; --border:#dde1e8;
  --fg:#1c2430; --fg-dim:#5a6577; --fg-mute:#8a94a4;
  --accent:#0891b2; --accent-soft:rgba(8,145,178,.12); --accent-2:#0e7490;
  --code-bg:#f2f4f7; --mark:#fde68a; --mark-fg:#1b1b1b;
  /* mismo par validado contra superficie clara; neutros re-escalonados hacia oscuro */
  --c-done:#16a34a; --c-review:#0891b2;
  --c-p1:#b3bcc9; --c-p2:#8a94a4; --c-p3:#5a6577;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
header.top{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--bg-alt);border-bottom:1px solid var(--border)
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.brand img{width:24px;height:24px;object-fit:contain;border-radius:4px}
.brand small{color:var(--fg-mute);font-weight:500;letter-spacing:0}
.search-wrap{flex:1;max-width:520px;position:relative;margin-left:8px}
#search{
  width:100%;padding:7px 30px 7px 32px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-soft);color:var(--fg);font-family:var(--sans);font-size:13.5px;outline:none
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-mute);font-size:13px;pointer-events:none}
.search-wrap kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--fg-mute);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--mono)}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
button.icon{
  background:var(--bg-soft);border:1px solid var(--border);color:var(--fg-dim);border-radius:8px;
  height:32px;min-width:32px;padding:0 9px;cursor:pointer;font-size:13px;font-family:var(--sans)
}
button.icon:hover{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}
#menu-btn{display:none}

aside.sidebar{
  position:fixed;top:52px;bottom:0;left:0;width:var(--sidebar-w);overflow-y:auto;
  background:var(--bg-alt);border-right:1px solid var(--border);padding:14px 0 40px
}
.side-title{padding:10px 16px 6px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-mute);font-weight:700}
.nav-item{
  display:block;padding:6px 16px 6px 16px;color:var(--fg-dim);font-size:13.5px;
  border-left:2px solid transparent;cursor:pointer;word-break:break-word
}
.nav-item:hover{background:var(--bg-soft);color:var(--fg);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.nav-item .sub{display:block;font-size:11.5px;color:var(--fg-mute);line-height:1.35}
.nav-item.active .sub{color:var(--fg-dim)}
.pin{display:flex;gap:9px;align-items:flex-start}
.pin .tag{
  flex:none;margin-top:2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--border);border-radius:4px;padding:1px 4px;background:var(--bg-soft)
}
details.group{border-top:1px solid var(--border);margin-top:8px}
details.group>summary{
  padding:8px 16px;cursor:pointer;color:var(--fg-dim);font-size:12px;font-weight:650;
  letter-spacing:.04em;list-style:none;display:flex;align-items:center;gap:6px;user-select:none
}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary:before{content:"▸";color:var(--fg-mute);font-size:10px;transition:transform .15s}
details.group[open]>summary:before{transform:rotate(90deg)}
details.group>summary:hover{color:var(--fg);background:var(--bg-soft)}
details.group>summary .count{margin-left:auto;color:var(--fg-mute);font-size:11px;font-family:var(--mono)}
.group .nav-item{padding-left:30px;font-size:12.8px}

main{
  margin:52px 0 0 var(--sidebar-w);padding:26px 34px 90px;
  max-width:none;min-height:calc(100vh - 52px)
}
.with-toc main{margin-right:var(--toc-w)}
aside.toc{
  position:fixed;top:52px;right:0;bottom:0;width:var(--toc-w);overflow-y:auto;
  padding:20px 14px 60px;border-left:1px solid var(--border);background:var(--bg)
}
aside.toc .side-title{padding:0 0 8px}
.toc a{display:block;color:var(--fg-mute);font-size:12.3px;padding:3px 8px;border-left:2px solid transparent;line-height:1.4}
.toc a:hover{color:var(--fg);text-decoration:none}
.toc a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.toc a.lvl3{padding-left:20px;font-size:11.8px}
.toc a.lvl4{padding-left:32px;font-size:11.4px;color:var(--fg-mute)}

/* ---------- doc header ---------- */
.doc-head{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:22px}
.crumbs{font-family:var(--mono);font-size:11.5px;color:var(--fg-mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs .file{color:var(--accent-2)}
.doc-head h1.doc-title{margin:8px 0 0;font-size:26px;line-height:1.25;letter-spacing:-.01em}
.doc-meta{margin-top:6px;font-size:12px;color:var(--fg-mute);display:flex;gap:14px;flex-wrap:wrap}

/* ---------- markdown ---------- */
.md{max-width:900px}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.9em 0 .6em;font-weight:660;letter-spacing:-.005em;scroll-margin-top:70px;position:relative}
.md h1{font-size:25px;border-bottom:1px solid var(--border);padding-bottom:.3em}
.md h2{font-size:20.5px;border-bottom:1px solid var(--border);padding-bottom:.28em;color:var(--fg)}
.md h3{font-size:17px;color:var(--accent-2)}
.md h4{font-size:15px;color:var(--fg-dim);text-transform:none}
.md h5,.md h6{font-size:13.5px;color:var(--fg-dim)}
.md h1:first-child,.md h2:first-child{margin-top:0}
.md .anchor{position:absolute;left:-18px;color:var(--fg-mute);opacity:0;font-weight:400;text-decoration:none}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor{opacity:.6}
.md p{margin:.75em 0}
.md ul,.md ol{margin:.6em 0;padding-left:1.5em}
.md li{margin:.28em 0}
.md li>ul,.md li>ol{margin:.25em 0}
.md blockquote{
  margin:1em 0;padding:.5em 1em;border-left:3px solid var(--accent);
  background:var(--bg-soft);border-radius:0 6px 6px 0;color:var(--fg-dim)
}
.md blockquote p{margin:.35em 0}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md code{
  font-family:var(--mono);font-size:.87em;background:var(--code-bg);border:1px solid var(--border);
  border-radius:5px;padding:.1em .35em;color:var(--accent-2);word-break:break-word
}
.md pre.code{
  position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:9px;
  padding:13px 15px;overflow-x:auto;margin:1em 0;font-size:12.8px;line-height:1.55
}
.md pre.code code{background:none;border:0;padding:0;color:var(--fg);font-size:inherit;white-space:pre}
.md pre.code[data-lang]:before{
  content:attr(data-lang);position:absolute;top:0;right:0;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);background:var(--bg-soft);
  border-left:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0 8px 0 8px;padding:2px 7px
}
.copy-btn{
  position:absolute;top:6px;right:8px;opacity:0;transition:opacity .12s;background:var(--bg-soft);
  border:1px solid var(--border);color:var(--fg-dim);border-radius:6px;font-size:10.5px;padding:2px 7px;cursor:pointer;z-index:2
}
pre.code:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--accent);border-color:var(--accent)}
.md table{border-collapse:collapse;margin:1.1em 0;font-size:13.2px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.md th{background:var(--bg-soft);font-weight:650;color:var(--fg);white-space:nowrap}
.md tbody tr:nth-child(even){background:rgba(127,127,127,.045)}
.md img{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.md del{color:var(--fg-mute)}
.md .task{margin-right:.4em}
.md a[data-missing="1"]{color:var(--warn);border-bottom:1px dotted var(--warn)}
.md mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 2px}

/* frontmatter + yaml */
details.frontmatter{border:1px solid var(--border);border-radius:9px;background:var(--bg-alt);margin:0 0 20px}
details.frontmatter>summary{
  cursor:pointer;padding:8px 13px;font-size:12px;color:var(--fg-mute);font-family:var(--mono);
  letter-spacing:.04em;user-select:none
}
details.frontmatter>summary:hover{color:var(--accent)}
details.frontmatter pre.code{margin:0;border:0;border-top:1px solid var(--border);border-radius:0 0 8px 8px}
.y-key{color:var(--accent-2)}
.y-com{color:var(--fg-mute);font-style:italic}
.y-val{color:var(--fg)}
.y-num{color:var(--ok)}
.csv-info{font-size:12px;color:var(--fg-mute);font-family:var(--mono);margin-bottom:8px}

/* ---------- graficos (bloques ```chart) ---------- */
.chart{
  background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;
  padding:15px 17px 13px;margin:1.2em 0;max-width:820px
}
.chart-title{
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-mute);
  font-weight:700;margin-bottom:12px
}
.chart-hero{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 0 16px}
.chart-hero b{font-size:48px;line-height:1;font-weight:660;letter-spacing:-.025em;color:var(--fg)}
.chart-hero span{font-size:12.5px;color:var(--fg-dim)}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:11.5px;color:var(--fg-dim)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart-legend i.fill-track{background:var(--bg-soft);border:1px solid var(--border)}
.crow{display:flex;align-items:center;gap:11px;margin:7px 0}
.crow .clabel{
  flex:0 0 clamp(84px,25%,186px);color:var(--fg-dim);font-size:12.3px;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.crow .ctrack{
  flex:1;min-width:70px;height:14px;border-radius:4px;background:var(--bg-soft);
  display:flex;overflow:hidden
}
.crow .cbar{flex:1;min-width:70px;height:14px;display:flex}
.crow .cseg{height:100%}
.crow .cseg+.cseg{border-left:2px solid var(--bg-alt)}
.crow .cfill{height:100%;border-radius:0 4px 4px 0}
.crow .cval{flex:0 0 96px;font-family:var(--mono);font-size:11.5px;color:var(--fg-dim);white-space:nowrap}
.crow.total .clabel{color:var(--fg);font-weight:650}
.crow.total .ctrack{height:18px}
.chart-note{margin:12px 0 0;font-size:11.5px;color:var(--fg-mute)}
.fill-done{background:var(--c-done)}
.fill-review{background:var(--c-review)}
.fill-p3{background:var(--c-p3)}
.fill-p2{background:var(--c-p2)}
.fill-p1{background:var(--c-p1)}
@media (max-width:640px){
  .crow{gap:8px}
  .crow .clabel{flex-basis:88px;font-size:11.5px}
  .crow .cval{flex-basis:76px;font-size:10.8px}
  .chart-hero b{font-size:38px}
}

/* ---------- search results ---------- */
.result{display:block;padding:9px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.result:hover{background:var(--bg-soft);text-decoration:none}
.result .rtitle{font-size:13px;color:var(--fg);font-weight:600}
.result .rpath{font-family:var(--mono);font-size:10.5px;color:var(--fg-mute)}
.result .rsnip{font-size:11.8px;color:var(--fg-dim);margin-top:3px;line-height:1.45;max-height:3.4em;overflow:hidden}
.result mark{background:var(--accent-soft);color:var(--accent);border-radius:2px}
.empty{padding:18px 16px;color:var(--fg-mute);font-size:13px}

/* ---------- misc ---------- */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--bg-alt);border:1px solid var(--accent);color:var(--fg);padding:9px 16px;border-radius:9px;
  font-size:13px;z-index:80;transition:opacity .18s,transform .18s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.35);max-width:80vw
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.missing{border:1px dashed var(--warn);border-radius:10px;padding:20px;color:var(--fg-dim)}
.missing code{color:var(--warn)}
.backdrop{display:none;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.5);z-index:29}
@media (max-width:1180px){ .with-toc main{margin-right:0} aside.toc{display:none} }
@media (max-width:860px){
  #menu-btn{display:inline-block}
  aside.sidebar{transform:translateX(-100%);transition:transform .2s;z-index:30;width:82vw;max-width:330px}
  body.nav-open aside.sidebar{transform:none}
  body.nav-open .backdrop{display:block}
  main{margin-left:0;padding:20px 16px 80px}
  .search-wrap kbd{display:none}
}
@media print{
  header.top,aside.sidebar,aside.toc,.copy-btn{display:none}
  main{margin:0;padding:0}
  body{background:#fff;color:#000}
}
</style>
</head>

  <button class="icon" id="menu-btn" title="Menú">☰</button>

</header>

<script type="application/json" id="payload">{"files":{"bmad-manual.md":{"t":"Manual de uso de bmad","c":"# Manual de uso de bmad\n\n### 1. Preparación y Alineación (Fase 0)\n\n**`bmad-bmb-setup`**: Instalar el módulo base de BMad en el repositorio para tener la estructura de `/doc` y `_bmad` lista.\n**`bmad-document-project`** (**CRÍTICO**): Este es el paso más importante. El skill escaneará el proyecto existente para generar el `project-context.md`. Sin esto, el agente no conocerá las dependencias actuales, la arquitectura de rutas o los componentes personalizados que podrían romperse.\n\n### 2. Definición del Objetivo (Análisis)\n**`bmad-prd`**: Crea un documento de requerimientos donde se especifique la versión de salida y la versión destino (ej. Laravel 10 -> 11). Aquí se documentan las motivaciones técnicas y las dependencias críticas que deben actualizarse (PHP, Composer, NPM).\n\n**`bmad-validate-prd`**: Útil ahora porque acabamos de editar el PRD y cambió la secuencia de épicas. Validaría consistencia, huecos, trazabilidad, numeración, riesgos y si el PRD ya está suficientemente claro para alimentar arquitectura.\n\n**`bmad-technical-research`**: Investiga tanta veces sea necesario para obtener información relevante.\n\n**`bmad-agent-tech-writer`**: con acción Validate Document: revisar claridad/documentación del PRD o inventario, no es gate BMad principal.\n\n### 3. Diseño de la Arquitectura y Estrategia de implementación\n**`bmad-create-architecture`**: La arquitectura va a tomar decisiones técnicas desde ese PRD; si el PRD todavía tiene inconsistencias, las amplifica.\n\n**`bmad-create-epics-and-stories`**: Crea los epics y indica de historias.\n- aplicar [A] Advanced Elicitation + [P] Party Mode para todas las historias, para afinar su definción\n\n**`bmad-check-implementation-readiness`**: Gate final antes de implementar: revisa PRD + arquitectura + épicas/stories.\n- si requiere trabajo aun despues de este paso, se puede usar **`bmad-correct-course`** para corregirlo.\n\n**`bmad-sprint-planning`**: Genera el `sprint-status.yaml` para trackear el progreso.\n**`bmad-sprint-status`**: Para validar el sprint-status\n\n\n### 4. Ejecución de las historias\n**`bmad-create-story`** crea la siguiente historia: xxx\n**`bmad-create-story`** valida la historia creada\n**`bmad-dev-story`** implementa la historia validada\n**`bmad-code-review`** revisa el cambio\n**`bmad-qa-generate-e2e-tests`**: Si el proyecto no tenía tests, este es el momento de generar pruebas de humo en las rutas críticas para asegurar que el salto de versión no rompió el flujo principal.\n\n\n"},"imaging-with-ui.md":{"t":"Generación de imágenes local: Ollama, dalle.text2im y ComfyUI","c":"# Generación de imágenes local: Ollama, `dalle.text2im` y ComfyUI\n\n## Contexto del problema\nAl intentar generar una imagen usando Ollama, apareció una respuesta JSON como esta:\n\n```json\n{\n  \"action\": \"dalle.text2im\",\n  \"action_input\": \"{ \\\"prompt\\\": \\\"...\\\" }\"\n}\n```\n\nEsto **no es la imagen** ni un error clásico de renderizado. Es una **llamada de herramienta** (tool call) que el modelo intentó ejecutar.\n\n## ¿Por qué pasa?\n- El modelo devolvió una intención de usar la herramienta `dalle.text2im`.\n- `dalle.text2im` corresponde a un flujo de OpenAI/DALL·E, no a una capacidad nativa de Ollama.\n- Si tu entorno no tiene esa herramienta integrada, el resultado se queda en texto JSON.\n\n## Cómo corregirlo\n1. Usar un flujo que sí ejecute herramientas y conectar un generador real (por ejemplo, ComfyUI/Stable Diffusion).\n2. O usar Ollama solo para texto/prompts y generar la imagen en otra app local.\n3. Si usas un frontend (OpenWebUI u otro), desactivar tool-calling para ese modelo cuando no hay tools configuradas.\n\n## Mejor opción gratuita para generar imágenes localmente\nDepende de licencia y hardware:\n\n1. **FLUX.1-dev + ComfyUI**\n- Excelente calidad para uso local.\n- Enfoque recomendado para uso personal/no comercial (revisar licencia específica del modelo).\n\n2. **Stable Diffusion 3.5 Large / 3.5 Large Turbo**\n- Muy buen equilibrio calidad/velocidad.\n- Opción fuerte cuando necesitas un marco de uso más flexible para proyectos.\n\n3. **SDXL 1.0**\n- Muy estable y común.\n- Buena alternativa cuando la GPU/VRAM es más limitada.\n\n## ¿Qué es ComfyUI?\n**ComfyUI** es una interfaz visual por nodos para pipelines de imagen local.\n\nPermite:\n- Conectar nodos de prompt, modelo, sampler, VAE, upscale, etc.\n- Ejecutar flujos reproducibles para text2img, img2img, inpainting y más.\n- Obtener mayor control que interfaces de “un solo botón”.\n\nResumen práctico: Ollama te sirve muy bien para texto/orquestación; ComfyUI te resuelve la generación de imagen local con control fino.\n\n## Fuentes de referencia\n- FLUX.1-dev: https://huggingface.co/black-forest-labs/FLUX.1-dev\n- SD 3.5 Large: https://huggingface.co/stabilityai/stable-diffusion-3.5-large\n- SD 3.5 Large Turbo: https://huggingface.co/stabilityai/stable-diffusion-3.5-large-turbo\n- ComfyUI: https://github.com/comfyanonymous/ComfyUI\n- SDXL 1.0: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0\n\n## Siguiente recomendación\nSi vas a instalar hoy mismo, define primero tu VRAM (por ejemplo 8 GB, 12 GB, 24 GB) y en base a eso eliges modelo + preset de calidad/velocidad.\n"},"ley-21719-proteccion-datos.md":{"t":"Ley 21719 - Protección de datos personales","c":"# Ley 21719 - Protección de datos personales\n\n## Resumen completo de la Ley 21719\n\nLa Ley N° 21719, promulgada el 25 de noviembre de 2024 y publicada el 13 de diciembre de 2024, introduce modificaciones sustanciales a la Ley N° 19.628 (Ley de Protección de la Vida Privada) y establece un marco integral para la protección de datos personales en Chile. La ley entró en vigor el 1 de diciembre de 2026, tras un período de vigencia diferida.\n\n**Ref**: https://www.bcn.cl/leychile/navegar?idNorma=1209272\n\n### Principales aspectos de la Ley 21719:\n\n1. **Ámbito de aplicación territorial**: La ley se aplica a tratamientos de datos realizados en Chile, así como a tratamientos extranjeros que ofrezcan bienes o servicios a residentes chilenos.\n\n2. **Definiciones ampliadas**: Introduce definiciones detalladas de conceptos clave como:\n   - *Datos personales*: Cualquier información vinculada o referida a una persona natural identificada o identificable\n   - *Datos personales sensibles*: Información sobre características físicas, morales, salud, orientación sexual, etc.\n   - *Tratamiento*: Cualquier operación o conjunto de operaciones con datos personales\n   - *Responsable*: Persona natural o jurídica que decide los fines y medios del tratamiento\n   - *Titular*: Persona natural a quien conciernen los datos personales\n\n3. **Principios rectores**: El tratamiento de datos debe cumplir con:\n   - Licitud y lealtad\n   - Finalidad\n   - Proporcionalidad\n   - Calidad\n   - Seguridad\n   - Transparencia e información\n   - Confidencialidad\n\n4. **Derechos de los titulares**: Incluye derechos de acceso, rectificación, supresión, oposición, portabilidad y bloqueo temporal.\n\n5. **Obligaciones del responsable**: \n   - Informar y poner a disposición los antecedentes que acrediten la licitud del tratamiento\n   - Garantizar estándares adecuados de seguridad\n   - Adoptar medidas de protección desde el diseño y por defecto\n   - Reportar vulneraciones de seguridad a la Agencia\n\n6. **Creación de la Agencia de Protección de Datos Personales**: Se establece una nueva autoridad autónoma encargada de fiscalizar, regular y sancionar el tratamiento de datos personales.\n\n7. **Mecanismos de sanción**: Define infracciones leves, graves y gravísimas con multas proporcionales y otras sanciones.\n\n8. **Disposiciones transitorias**: Establece plazos para la adaptación y entrada en vigor completa.\n\n### Impacto y alcance:\n\n- La ley modifica significativamente la forma en que las empresas y entidades deben gestionar los datos personales\n- Introduce nuevos requisitos de transparencia y seguridad\n- Establece derechos ampliados para los titulares de datos\n- Crea un marco regulatorio alineado con estándares internacionales de protección de datos\n\n> **Nota**: Esta ley entra en vigor el 1 de diciembre de 2026, tras un período de vigencia diferida establecido en la normativa.\n"},"migracion-sis.md":{"t":"Orquestador","c":"# Orquestador\nComo crear un orquestrador que sea capaz de invocar otros agentes, incluso con modelos distintos para poder completar de forma automatica una migracion completa de tecnologia de un proyecto actual.\nEl orquestrador tendrá acceso a otros agentes a traves de comandos especificos y deberá ser capaza de esperar cuando los creditos de los agentes se acaben. Tambien debe ser capaz de decidir cual modelo usar segun la complejidad de la tarea.\nCuando el orquestrador requiera decisiones humanas, debe enviar un correo electronico al humano con un enlace para poder leer la consulta y responder. este sistema de comuinicacion debe ser defindio y creado antes de empezar el trabajo real (en la epic 0). este sistema web tambien debe contemplar una forma de visualizar los avances y trabajos realizados por el agente y sub agentes.\nnunca se debe hacer push remoto, solamente se debe usar commit local.\nCuando el orquestrador no puede seguir por falta de creditos y debe esperar hasta la proxima ventana, debe enviar un mail al humano para avisarle de todos los trabajos realizados, y esperar hasta la proxima ventana disponible.\nEl orquestrador debe tener memoria y ser capaz de remotar su trabajo donde mismo lo dejo.\nEl orquestrador tendra acceso a un modelo exclusivo para poder hacer su trabajo, y tendra acceso a otros modelos de IA para derivar las tareas.\nEl orquestrador debe tratar de delegar lo mas posible el trabajo, para evitar consumir sus propios tokens. Debe tener un rol de orquestrador.\nEn la epic 0 se debe trabajar y dejar documentado los pasos de ejecuciones, validaciones, modificaciones, criterios de aceptaciones y ciclos de iteraciones para trabajar.\nEn la epic 0 se deben definir los agentes que usará el orquestrador y para que usarlos.\nLa epic 0 será implementada en conjunto con el humano.\nEl orquestrador debe ser capaz de ejecutar una epic completa sin parar, salvo que este a la espera de \nEl orquestrador debe ser capaz de\nLa epic 0, se debe usar para prepara el trabajo y definir la linea de implementacion completo del proyecto.\nEl proyecto actual, su codigo fuente y base de datos debe ser tocado, se debe mantener tal cual y el orquestrador debe poder leer el codigo, inspeccionar la base de datos y visualizar la app existente.\nEl la epic 0 tambien se debe definir la nueva interfaz visual.\nEn la epic 0 se debe construir el listado exhaustivo de funcionalidades existentes y las modificaciones/mejoras que se realizarán.\nse debe contemplar modificaciones de los nombres de las tablas y columnas de la base de datos para sea sean en ingles y que tengan un formato estandar.\nse debe configurar ambiente de tipo mock para todos los servicios externos, incluyendo mailpip y un proyecto dedicado.\nPara crear sub agentes disponibles en codex, ver la facitibilidad de crear usuarios linux que pertenezcan al mismo grupo \"dev\" y que tengan los permisos para trabajar, y que cada uno este asociado a una cuenta de chatgpt distinta.\nCada agente codex debe poder usarse con un modelo especifico, especificado por linea de comando.\nSe debe poder probar la disponibilidad de un agente codex por linea de comando.\nDebe existir archivos claros de reglas de desarrollo, definidos en epic 0, y se pueden ir modificando por el humano durante el desarrollo.\nLa estructura del orquestrador debe quedar completamente idependiente del proyecto y debe poder ser capaz de aplicarse a otro proyecto, incluso en paralelo.\n# Migracion SIS\nLa migracion del sistema SIS debe ser la siguiente:\n- cambio de nombre a Abax, uso de namespaces y packages\n- cambio de stack a: single-page app, spring boot sobre undertow, view.js, html y css moderno, api externa documentada, api bff  para servir la app. debe haber investigacion para separacion de responsabilidades de la app y salirse del patron monolitico. mantener base de datos postgres. storage de archivos tipo , con cache local para evitar sobre costo. debe ser arquitectura HA. debe tener una base de datos central para cuentas de clientes ( administracion interna), otra para tablas maestras, y una mas por cada cliente. debe tener enfoque en la seguridad y seguir la nueva reglamentacion de datos de chile (y ojala de europa). debe ser un sitio multi-idioma. \n- mejoras futuras para tomar en cuenta durante la implementacion inicial: sistema de ficha clinica unica para paciente, comuncaicones  entre distintas instancias del abax para poder intercambiar datos de paciente y ordenes medicas, autorizaciones de compartir ficha para paciente, modulo de contabilidad con facturacion electronica, modulo de marketing y mailing (usando un proveedor externo para el envio de mail, whatsapp, u otros), integracion de la IA en toda la app.\n"},"ollama-best-model.md":{"t":"Best Open Source Models","c":"# Best Open Source Models\n\n**Fecha**: 2026-05-08\n\n## Cloud\n| Caso de uso | Modelo recomendado | Comando |\n| :--- | :--- | :--- |\n| Programación | Kimi K2.6 | ollama run kimi-k2.6:cloud |\n| Análisis de logs | Gemma 31b | ollama run gemma4:31b-cloud |\n| Lógica | DeepSeek V4 Pro | ollama run deepseek-v4-pro:cloud |\n\n\n## Local\n| Caso de uso | Modelo recomendado | Comando |\n| :--- | :--- | :--- |\n| Programación |??? | ??? |\n| Análisis de logs | Mistral 7b | ollama run mistral:7b |\n| Lógica |??? |??? |\n"},"ollama-vs-vllm.md":{"t":"ollama-vs-vllm.md","c":"### 1. vLLM (High-Throughput Serving)\nvLLM está diseñado para maximizar el rendimiento (throughput) y la eficiencia de la memoria en entornos de servidor. Su innovación principal es **PagedAttention**, que optimiza la \ngestión de la memoria KV (Key-Value) para permitir procesar muchas solicitudes simultáneamente.\n\n*   **Enfoque:** Rendimiento, escalabilidad y despliegue en la nube.\n*   **Características clave:**\n    *   **PagedAttention:** Evita la fragmentación de memoria, permitiendo batches mucho más grandes.\n    *   **Continuous Batching:** No espera a que termine una solicitud para empezar la siguiente; procesa tokens de múltiples solicitudes dinámicamente.\n    *   **API compatible con OpenAI:** Permite reemplazar el backend de OpenAI fácilmente.\n    *   **Soporte Multi-GPU:** Excelente soporte para distribuir modelos grandes en varias tarjetas gráficas.\n*   **Ideal para:** Empresas que necesitan servir un modelo a miles de usuarios, aplicaciones SaaS, entornos de Kubernetes y despliegues en GPU potentes (NVIDIA A100, H100, etc.).\n\n### 2. Ollama (Local LLM Runner)\nOllama es una capa de abstracción construida sobre `llama.cpp`. Su objetivo es que cualquier persona pueda ejecutar un LLM en su propia computadora (Laptop, Desktop) sin complicaciones \ntécnicas.\n\n*   **Enfoque:** Simplicidad, facilidad de uso y despliegue local.\n*   **Características clave:**\n    *   **Instalación \"One-Click\":** Se instala como una aplicación común.\n    *   **Gestión de Modelos:** Tiene su propio \"registro\" (como Docker Hub). Solo escribes `ollama run llama3` y él descarga, configura y ejecuta el modelo.\n    *   **Cuantización eficiente:** Utiliza modelos GGUF que permiten ejecutar LLMs en CPUs o GPUs con poca VRAM.\n    *   **Soporte multiplataforma:** Funciona excelente en macOS (Apple Silicon), Linux y Windows.\n*   **Ideal para:** Desarrolladores que quieren probar modelos localmente, usuarios domésticos, prototipado rápido y aplicaciones que no requieran un tráfico masivo de usuarios.\n\n---\n### Tabla Comparativa\n\n| Característica | vLLM | Ollama |\n| :--- | :--- | :--- |\n| **Objetivo Principal** | Alto rendimiento / Producción | Facilidad de uso / Uso local |\n| **Carga de Trabajo** | Muchas solicitudes simultáneas | Un usuario o pocos usuarios |\n| **Instalación** | Compleja (Python, CUDA, Docker) | Muy simple (Instalador) |\n| **Gestión de Memoria** | PagedAttention (Muy eficiente) | Basado en llama.cpp (Eficiente) |\n| **Hardware** | Principalmente GPUs potentes | CPU, GPU, Apple Silicon (Unificada) |\n| **Cuantización** | Soporta AWQ, FP8, GPTQ | Soporta GGUF (muy versátil) |\n| **Escalabilidad** | Diseñado para clusters y nube | Diseñado para una sola máquina |\n| **Interfaz** | API REST (estilo OpenAI) | CLI y API local |\n\n---\n\n### ¿Cuál elegir?\n\n#### Elige **vLLM** si:\n1. Estás construyendo una **aplicación comercial** que será usada por muchas personas al mismo tiempo.\n2. Tienes acceso a **GPUs de grado servidor** (NVIDIA A100, H100, A10) o varias GPUs.\n3. Necesitas la **menor latencia posible** y el mayor número de tokens por segundo.\n4. Estás desplegando en la nube mediante **Docker o Kubernetes**.\n\n#### Elige **Ollama** si:\n1. Quieres ejecutar un LLM en tu **propia laptop** (especialmente si tienes un Mac M1/M2/M3).\n2. Quieres **probar rápidamente** diferentes modelos (Llama 3, Mistral, Phi-3) sin configurar entornos de Python.\n3. No tienes una GPU potente o quieres ejecutar el modelo principalmente en la **CPU/RAM**.\n4. Estás desarrollando el frontend de una app y necesitas un **backend local rápido** para hacer pruebas.\n"},"openclaw_nemotorn_ollama.md":{"t":"--- Configuración de Colores para Visibilidad ---","c":"Este video presenta un ecosistema de agentes de IA potente y gratuito que puedes correr localmente (o en la nube de forma gratuita) utilizando tres componentes clave: **OpenClaw**, **Ollama** y el modelo **Nvidia Nemotron 3 Super**.\n\nAquí tienes el análisis detallado que solicitaste:\n\n### 1. Explicación de las Herramientas\n\n* **OpenClaw (El Cerebro/Controlador):** Es un asistente personal de código abierto que actúa como una \"puerta de enlace\" (gateway). Su función es conectar tus aplicaciones de mensajería (WhatsApp, Discord, Telegram) con modelos de IA, permitiendo que un agente trabaje para ti las 24 horas del día.\n* **Ollama (El Motor de Ejecución):** Es una plataforma que permite descargar y ejecutar modelos de lenguaje (LLMs) directamente en tu propia computadora de manera sencilla. Se encarga de gestionar los recursos de tu hardware para que la IA funcione.\n* **Nvidia Nemotron 3 Super (La Inteligencia):** Es el modelo de lenguaje de 120 billones de parámetros (MoE - Mixture of Experts) lanzado por NVIDIA. Destaca por tener una ventana de contexto enorme (hasta 1 millón de tokens) y ser extremadamente eficiente, ideal para tareas complejas de razonamiento y codificación.\n\n---\n\n### 2. Paso a Paso para Implementación Local\n\nSigue estos pasos para configurar el entorno en tu terminal:\n\n1. **Instalar Ollama:** Ve a [ollama.com](https://ollama.com) y descarga la versión para tu sistema operativo.\n2. **Ejecutar Nemotron 3 Super:**\n* Abre tu terminal y escribe el siguiente comando para usar la versión en la nube (más rápida si no tienes un superordenador):\n`ollama run nemotron3-super:cloud`\n* Si prefieres la versión local (pesa 87GB), usa: `ollama run nemotron3-super`.\n\n\n3. **Instalar OpenClaw:**\n* Necesitas tener Node.js instalado. Ejecuta en la terminal:\n`npm install -g openclaw`\n\n\n4. **Lanzar el Ecosistema:**\n* Para conectar OpenClaw con el modelo que acabas de descargar, usa:\n`launch openclaw model nemotron3-super:cloud`\n\n\n5. **Acceder a la Interfaz:**\n* Una vez iniciado, abre tu navegador en `http://127.0.0.1:18789/` para chatear con tu agente y configurar los canales de mensajería.\n\n\n\n---\n\n### 3. Documentación Oficial\n\n* **OpenClaw:** [Documentación en GitHub](https://github.com/steipete/clawdis/blob/main/docs/index.md) o [Guía de configuración avanzada](https://docs.z.ai/devpack/tool/openclaw).\n* **Ollama:** [Documentación oficial y comandos](https://docs.ollama.com/).\n* **Nvidia Nemotron 3 Super:** [Blog técnico de NVIDIA](https://developer.nvidia.com/blog/introducing-nemotron-3-super-an-open-hybrid-mamba-transformer-moe-for-agentic-reasoning/) y su [Model Card en Hugging Face](https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4).\n\n---\n\n### 4. Recomendación de Máquina Física\n\nPara correr un modelo de **120B parámetros** como Nemotron 3 Super de forma local y fluida (sin depender de la nube), los requisitos son exigentes:\n\n* **Opción Apple (Recomendada por eficiencia):**\n* **Mac Studio o Mac Pro con chip M2/M3 Ultra.**\n* **Memoria RAM (Unified Memory):** Mínimo 128 GB (idealmente 192 GB) para cargar el modelo completo y tener contexto amplio.\n\n\n* **Opción PC (Windows/Linux):**\n* **GPU:** Al menos 2x NVIDIA RTX 3090 o 4090 (24GB VRAM cada una) conectadas por NVLink para sumar VRAM, o una NVIDIA A100/H100 de 80GB.\n* **RAM del sistema:** 128 GB o más.\n* **Almacenamiento:** SSD NVMe de 2TB (el modelo solo ya ocupa cerca de 90GB-200GB según la cuantización).\n\n\n\n---\n\n### 5. Resumen Ejecutivo de la Solución\n\n**Propuesta de Servicio:**\nLa solución propone un **Stack de Agentes de IA 24/7 Soberano**. Permite a emprendedores y desarrolladores tener un asistente de nivel empresarial que reside en su propio hardware, sin costos de suscripción mensual ni riesgos de privacidad de datos, capaz de gestionar múltiples canales de comunicación y tareas complejas de búsqueda web y codificación.\n\n**Herramientas Gratuitas adicionales para integrar:**\n\n1. **Hunter Alpha / Healer Alpha:** Mencionados en el video como modelos alternativos gratuitos que a veces superan a Nemotron en tareas específicas.\n2. **Make.com (Nivel gratuito):** Para crear flujos de automatización que conecten OpenClaw con otras 1000+ aplicaciones (Google Drive, Gmail, etc.).\n3. **AnythingLLM:** Para darle a tu agente \"memoria a largo plazo\" cargando tus propios documentos (PDFs, Excels) y que pueda responder basándose en tu información privada.\n4. **Dify.ai:** Si quieres construir flujos de trabajo (workflows) más visuales y complejos antes de enviarlos a la puerta de enlace de OpenClaw.\n\n\n### Script de Instalación Total Local (`full_local_ai_stack.sh`)\n\nCopia este código en tu servidor Ubuntu 25.04:\n\n```bash\n#!/bin/bash\n\n# --- Configuración de Colores para Visibilidad ---\nGREEN='\\033[0;32m'\nYELLOW='\\033[1;33m'\nRED='\\033[0;31m'\nNC='\\033[0m'\n\necho -e \"${GREEN}### INICIANDO INSTALACIÓN INTEGRAL - UBUNTU SERVER 25.04 ###${NC}\"\n\n# 0. Verificación de permisos\nif [[ $EUID -ne 0 ]]; then\n   echo -e \"${RED}Este script debe ejecutarse como root (usa sudo).${NC}\"\n   exit 1\nfi\n\n# 1. Gestión de Memoria: Creación de Swap de 100GB\necho -e \"${YELLOW}[1/6] Configurando 100GB de Memoria Swap...${NC}\"\nif [ ! -f /swapfile ]; then\n    fallocate -l 100G /swapfile\n    chmod 600 /swapfile\n    mkswap /swapfile\n    swapon /swapfile\n    echo '/swapfile none swap sw 0 0' >> /etc/fstab\n    echo -e \"${GREEN}Swap configurado correctamente.${NC}\"\nelse\n    echo -e \"${YELLOW}El archivo Swap ya existe. Saltando...${NC}\"\nfi\n\n# 2. Soporte de GPU: Drivers NVIDIA y Container Toolkit\necho -e \"${YELLOW}[2/6] Instalando Drivers NVIDIA y dependencias...${NC}\"\napt update && apt upgrade -y\napt install -y nvidia-driver-550-server nvidia-utils-550-server curl git\n\necho -e \"${YELLOW}Configurando NVIDIA Container Toolkit...${NC}\"\ncurl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg\ncurl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \\\n  sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \\\n  tee /etc/apt/sources.list.d/nvidia-container-toolkit.list\napt update && apt install -y nvidia-container-toolkit\n\n# 3. Instalación de Ollama\necho -e \"${YELLOW}[3/6] Instalando Ollama (Motor de Modelos)...${NC}\"\ncurl -fsSL https://ollama.com/install.sh | sh\n\n# 4. Instalación de Node.js (Requerido para OpenClaw)\necho -e \"${YELLOW}[4/6] Instalando Node.js LTS...${NC}\"\ncurl -fsSL https://deb.nodesource.com/setup_lts.x | bash -\napt install -y nodejs\n\n# 5. Instalación de OpenClaw\necho -e \"${YELLOW}[5/6] Instalando OpenClaw vía NPM...${NC}\"\nnpm install -g openclaw\n\n# 6. Descarga del modelo Nemotron 3 Super\necho -e \"${RED}[6/6] INICIANDO DESCARGA DEL MODELO (87GB+). ESTO TARDARÁ MUCHO...${NC}\"\nollama pull nemotron3-super\n\n# --- Finalización ---\necho -e \"------------------------------------------------------------\"\necho -e \"${GREEN}INSTALACIÓN COMPLETADA.${NC}\"\necho -e \"------------------------------------------------------------\"\necho -e \"${YELLOW}CONSEJOS POST-INSTALACIÓN:${NC}\"\necho -e \"1. Ejecuta 'nvidia-smi' para verificar que tu GPU es reconocida.\"\necho -e \"2. Inicia el entorno con: ${GREEN}launch openclaw model nemotron3-super${NC}\"\necho -e \"3. Accede a la WebUI en: ${GREEN}http://tu-ip-servidor:18789${NC}\"\necho -e \"------------------------------------------------------------\"\n\n```\n\n---\n\n### Detalles técnicos de lo que acabamos de hacer:\n\n* **Drivers NVIDIA 550-server:** He seleccionado la versión \"server\" porque es más estable para Ubuntu Server 25.04 y suele tener mejor compatibilidad con cargas de trabajo de IA.\n* **Swap de 100GB:** Al ser un modelo de 120 billones de parámetros, incluso con cuantización, cargarlo en memoria es un reto. Si tu RAM física se llena, el sistema usará el disco (más lento, pero evita que el proceso muera con un error `Out of Memory`).\n* **Apt-get vs NPM:** El script maneja ambos gestores de paquetes para asegurar que las dependencias de sistema y las de la aplicación (OpenClaw) estén en su sitio.\n\n### Advertencia Final\n\nEl modelo **Nemotron 3 Super** es masivo. Si ves que tu servidor va extremadamente lento tras lanzarlo, es porque está haciendo \"swapping\" (usando el disco como RAM). En ese caso, te recomiendo probar con la versión pequeña si solo quieres testear: `ollama run nemotron3-super:8b`.\n\n**¿Te gustaría que te ayude a configurar un acceso remoto seguro (como una VPN o túnel) para entrar a la interfaz de OpenClaw desde fuera de tu red local?**"},"opensource_ai_comparison.md":{"t":"Comparativa Actualizada de IA de Pesos Abiertos (Open-Weight)","c":"# Comparativa Actualizada de IA de Pesos Abiertos (Open-Weight)\n\nActualizado: **8 de abril de 2026**.\n\nEste documento prioriza datos verificables desde fuentes oficiales (model cards y blogs de los laboratorios). Se usa el término **open-weight** porque no todos estos modelos cumplen la definición estricta de open source de la OSI.\n\n## Resumen ejecutivo\n\n1. El ecosistema open-weight maduró rápido entre 2025 y 2026: hay modelos fuertes para razonamiento, agentes, coding y multimodal.\n2. La diferencia real ya no es solo \"calidad\"; es **licencia + costo de inferencia + contexto + tooling**.\n3. Varias comparativas virales mezclan cifras no oficiales. Aquí se corrigen con datos de origen.\n\n## Tabla comparativa (modelos relevantes)\n\n| Modelo | Tipo de apertura / licencia | Parámetros (total / activos) | Contexto | Modalidad | Comentario práctico |\n| --- | --- | --- | --- | --- | --- |\n| **Llama 4 Scout** (Meta) | Licencia **Llama 4 Community** (no OSI) | 109B / 17B (MoE) | 10M | Texto + imagen (salida texto/código) | Muy fuerte en contexto ultra largo, pero con licencia propia y restricciones de uso a gran escala. |\n| **Llama 4 Maverick** (Meta) | Licencia **Llama 4 Community** (no OSI) | 400B / 17B (MoE) | 1M | Texto + imagen (salida texto/código) | Variante mayor de Llama 4; buen equilibrio capacidad/costo por MoE. |\n| **Qwen3-235B-A22B-Instruct-2507** | **Apache 2.0** | 235B / 22B (MoE) | 262,144 nativo (extensible ~1,010,000) | Texto | Muy competitivo en agente/tool use y coding; versión 2507 mejora contexto largo. |\n| **DeepSeek-V3** | Código MIT + licencia de modelo propia | 671B / 37B (MoE) | 128K | Texto | Muy fuerte en razonamiento/código; uso comercial permitido según model card, bajo su licencia de modelo. |\n| **NVIDIA Nemotron 3 Super** | Open-weight + datos/recetas abiertas (ecosistema Nemotron) | 120B / 12B (MoE híbrido Mamba-Transformer) | hasta 1M | Texto (enfoque agentic) | Enfocado a throughput y agentes multietapa; fuerte apuesta de NVIDIA en 2026. |\n| **Mistral Small 3.1 (24B)** | **Apache 2.0** | 24B denso | 128K | Texto + imagen | Muy buena opción local/empresa para multimodal liviano y function calling. |\n| **Gemma 3 (Google)** | Licencia Gemma (pesos abiertos con términos) | 1B / 4B / 12B / 27B | 32K (1B), 128K (4B/12B/27B) | Texto + imagen (excepto 1B texto) | Excelente relación calidad/recursos para despliegue local y edge. |\n| **gpt-oss-120b / gpt-oss-20b** (OpenAI) | **Apache 2.0** | 117B / 5.1B y 21B / 3.6B (MoE) | 128K | Texto | Open-weight de OpenAI (2025), diseñado para razonamiento + tool use eficiente. |\n| **Phi-4-reasoning / Phi-4-mini-instruct** (Microsoft) | **MIT** | 14B (reasoning) / 3.8B (mini) | 32K (reasoning), 128K (mini) | Texto | Buen rendimiento por costo en hardware más acotado. |\n\n## Modelos nuevos (no estaban en el listado anterior)\n\nEstas familias/modelos aparecieron o tomaron relevancia después del set que teníamos originalmente:\n\n| Modelo/Familia | Estado reciente | Parámetros / contexto (según fuente oficial) | Licencia | Nota práctica |\n| --- | --- | --- | --- | --- |\n| **Gemma 4** (Google DeepMind) | Lanzado el 2 de abril de 2026 | E2B, E4B, 26B MoE, 31B Dense; 128K (edge) y hasta 256K (largos) | **Apache 2.0** | Salto importante para edge + agentic; reemplaza a Gemma 3 como referencia principal de la familia. |\n| **Qwen 3.5** (Alibaba/Qwen) | Nueva familia posterior a Qwen3 | Ejemplo: 397B total / 17B activos, 262,144 nativo (extensible ~1,010,000) | **Apache 2.0** | Muy fuerte para tool use/coding/visión-lenguaje en variantes grandes. |\n| **Nemotron 3 Ultra / Omni / VoiceChat** (NVIDIA) | Expansión anunciada 16 de marzo de 2026 | Ultra (familia 3): ~500B total / ~50B activos; Omni y VoiceChat agregan multimodal/voz | Open-weight (ecosistema Nemotron) | Línea claramente orientada a agentes multimodales y producción sobre stack NVIDIA. |\n| **OLMo 3.1** (Ai2) | Update de OLMo 3 anunciado el 12 de diciembre de 2025 | Checkpoints 32B Think/Instruct (familia 7B/32B) | **Apache 2.0** | Destaca por transparencia de datos/recetas y reproducibilidad científica. |\n| **Mistral 3 / Ministral 3** (Mistral AI) | Nueva generación abierta publicada en 2026 | Ministral 14B/8B/3B + Mistral Large 3 (675B total / 41B activos) | **Apache 2.0** | Cobertura completa desde edge/local hasta frontier open model empresarial. |\n| **Granite 4.0** (IBM) | Lanzado el 2 de octubre de 2025 y consolidado en 2026 | Familia híbrida (incluye MoE), p. ej. 32B total / 9B activos en variantes H-Small; 128K | **Apache 2.0** | Muy fuerte en costo/eficiencia para RAG y agentes empresariales. |\n\n## Correcciones clave respecto a comparativas antiguas\n\n1. **\"Open source\" vs \"open-weight\"**: Llama 4 y Gemma 3 publican pesos, pero sus licencias no son equivalentes a Apache/MIT.\n2. **Llama 4 licencia**: incluye términos comerciales adicionales (por ejemplo, cláusula de MAU altos), por lo que no conviene tratarla como Apache-like.\n3. **DeepSeek-V3**: no es simplemente \"MIT\" para todo; el código está en MIT, y el modelo bajo licencia específica.\n4. **Mistral**: lo más sólido y realmente abierto en 2025-2026 para uso amplio sigue siendo la línea Apache 2.0 (por ejemplo, Mistral Small 3.1).\n5. **Qwen3**: la rama reciente 2507 sube notablemente el contexto nativo frente a versiones previas.\n6. **Gemma**: la referencia actual ya es **Gemma 4** (Apache 2.0), no Gemma 3.\n7. **NVIDIA Nemotron**: además de Nano/Super/Ultra, en 2026 aparecen Omni y VoiceChat para casos multimodales y voz en tiempo real.\n\n## Recomendación rápida por perfil\n\n1. **Empresa que prioriza licencia permisiva**: Qwen3 o Mistral Small 3.1 (Apache 2.0), también gpt-oss (Apache 2.0).\n2. **Agentes con contexto largo**: Llama 4 Scout (10M) o Nemotron 3 (hasta 1M), validando licencia y costo real de inferencia.\n3. **Local con hardware moderado**: Gemma 4 (E2B/E4B) y Phi-4-mini-instruct.\n4. **Coding + tool use de alto nivel**: Qwen3-235B-A22B-Instruct-2507, DeepSeek-V3 o gpt-oss-120b según presupuesto y stack.\n\n## Fuentes (oficiales)\n\n- Meta Llama 4 Scout model card: https://huggingface.co/meta-llama/Llama-4-Scout-17B-16E-Instruct\n- Meta Llama 4 Maverick model card: https://huggingface.co/meta-llama/Llama-4-Maverick-17B-128E-Instruct\n- Qwen3-235B-A22B-Instruct-2507: https://huggingface.co/Qwen/Qwen3-235B-A22B-Instruct-2507\n- Qwen3-235B-A22B: https://huggingface.co/Qwen/Qwen3-235B-A22B\n- DeepSeek-V3 model card: https://huggingface.co/deepseek-ai/DeepSeek-V3\n- NVIDIA Nemotron portal: https://developer.nvidia.com/nemotron\n- NVIDIA Nemotron 3 family: https://research.nvidia.com/labs/nemotron/Nemotron-3/\n- NVIDIA Nemotron 3 Super: https://research.nvidia.com/labs/nemotron/Nemotron-3-Super/\n- Mistral Small 3.1 model card: https://huggingface.co/mistralai/Mistral-Small-3.1-24B-Instruct-2503\n- Gemma 3 model card (Google): https://huggingface.co/google/gemma-3-12b-pt\n- Gemma 3 overview (HF): https://huggingface.co/blog/gemma3\n- OpenAI gpt-oss announcement: https://openai.com/index/introducing-gpt-oss/\n- OpenAI gpt-oss-120b model card: https://huggingface.co/openai/gpt-oss-120b\n- Microsoft Phi-4-reasoning: https://huggingface.co/microsoft/Phi-4-reasoning\n- Microsoft Phi-4-mini-instruct: https://huggingface.co/microsoft/Phi-4-mini-instruct\n- Gemma 4 announcement (Google): https://blog.google/innovation-and-ai/technology/developers-tools/gemma-4/\n- Gemma 4 edge/developer details: https://developers.googleblog.com/bring-state-of-the-art-agentic-skills-to-the-edge-with-gemma-4/\n- Qwen3.5-397B-A17B model card: https://huggingface.co/Qwen/Qwen3.5-397B-A17B\n- Qwen3.5-35B-A3B model card: https://huggingface.co/Qwen/Qwen3.5-35B-A3B\n- NVIDIA Nemotron expansion (Ultra/Omni/VoiceChat): https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Expands-Open-Model-Families-to-Power-the-Next-Wave-of-Agentic-Physical-and-Healthcare-AI/default.aspx\n- NVIDIA Nemotron 3 family page: https://research.nvidia.com/labs/nemotron/Nemotron-3/\n- Ai2 OLMo 3 / 3.1 announcement: https://allenai.org/blog/olmo3\n- OLMo 3.1 32B Instruct model card: https://huggingface.co/allenai/Olmo-3.1-32B-Instruct\n- Mistral 3 announcement: https://mistral.ai/news/mistral-3\n- IBM Granite 4.0 announcement: https://www.ibm.com/new/announcements/ibm-granite-4-0-hyper-efficient-high-performance-hybrid-models\n- IBM Granite docs (4.0): https://www.ibm.com/us-en/granite/docs/models/granite\n"},"setup/AGENTS.md":{"t":"Repository Guidelines","c":"# Repository Guidelines\n\n## Source Of Truth\n- Prioriza el código y estructura actual del repositorio por sobre documentos antiguos.\n- No asumas funcionalidades completas solo porque hay dependencias instaladas.\n- Cuando haya conflicto entre documentación y comportamiento real, documenta la diferencia y sigue el estado real del sistema.\n\n## Project Structure & Ownership\n- Describe aquí los módulos principales (frontend, backend, admin, scripts, docs, etc.).\n- Mantén separadas las responsabilidades por capa/superficie.\n- Antes de agregar archivos nuevos, revisa si existe un módulo o carpeta donde encaje mejor el cambio.\n\n## Stack & Runtime\n- Lenguajes y versiones:\n- Frameworks principales:\n- Base de datos y servicios externos:\n- Forma de ejecución local: (nativa, Docker, etc.)\n\n## Commands\n- Comando de arranque local:\n- Comando de build:\n- Comando de tests:\n- Comando de lint/format:\n- Comandos de migración o seed (si aplica):\n\nIncluye siempre comandos listos para copiar/pegar y ejecutables desde la raíz del proyecto.\n\n## Do / Don't\nDo:\n- Mantener coherencia con arquitectura y convenciones existentes.\n- Documentar decisiones cuando afecten a más de un módulo.\n- Verificar impacto en rutas, config y datos antes de cerrar.\n\nDon't:\n- Romper compatibilidad sin advertirlo explícitamente.\n- Mezclar cambios no relacionados en el mismo commit.\n- Asumir contexto no documentado sin validarlo en el código.\n- Ejecutar test unitario sin que se lo pida el usuario.\n\n## Coding Style & Naming\n- Respeta convenciones existentes del repositorio antes de proponer nuevas.\n- Usa nombres explícitos y consistentes con el módulo (`camelCase`, `PascalCase`, `kebab-case`, etc., según corresponda).\n- Mantén funciones/métodos acotados y evita mezclar lógica de negocio con capa de presentación.\n- Agrega comentarios solo cuando expliquen intención o reglas no obvias.\n- Importa nuevas clases en la sección de declaración inicial del archivo para evitar el uso de package/namespace de las clases en el código.\n\n## Implementation Guardrails\n- No introducir frameworks o herramientas nuevas sin necesidad clara.\n- No mover lógica de negocio a vistas o templates.\n- No hardcodear credenciales, URLs de entorno o secretos.\n- Prefiere cambios pequeños, locales y trazables por sobre refactors masivos.\n\n## Testing Guidelines\n- Ejecuta pruebas relevantes del módulo afectado antes de cerrar cambios.\n- Si no existen tests automáticos, deja validación manual reproducible (pasos concretos).\n- Cuando agregues funcionalidad nueva, considera pruebas mínimas de regresión.\n\n## Commit & Pull Request Guidelines\n- Commits cortos, imperativos y enfocados en un solo objetivo.\n- PRs deben incluir: resumen, paths afectados, impacto técnico, cambios de configuración y validación realizada.\n- Si hay cambio visual, incluir evidencia (capturas o descripción clara del resultado).\n\n## Security & Configuration\n- Nunca subir secretos, tokens, llaves o credenciales reales.\n- Documentar configuración requerida vía variables de entorno.\n- Tratar archivos de configuración sensible como material restringido.\n\n"}},"generated":"2026-08-05 14:00 -0400","primary":[{"path":"bmad-manual.md","tag":"INI","label":"Manual de uso de bmad","desc":""}],"settings":{"branding":{"accent_dark":"#22d3ee","accent_light":"#0891b2","favicon":null,"logo":null,"name":"doc","tagline":"documentación"},"home":"bmad-manual.md","labels":{"all_documents":"Todos los documentos","featured":"Documentos principales","search_placeholder":"Buscar en la documentación…","toc":"En esta página"},"lang":"es","title":"doc"}}</script>

/* ========================= utils ========================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function slugify(t){
  return String(t).toLowerCase().trim()
    .replace(/<[^>]*>/g,'')
    .replace(/[`*_~]/g,'')
    .replace(/[‘’“”]/g,'')
    .replace(/[^\p{L}\p{N} \-_]/gu,'')
    .replace(/\s+/g,'-');
}
function dirname(p){ var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
function basename(p){ var i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); }
function ext(p){ var b = basename(p), i = b.lastIndexOf('.'); return i < 0 ? '' : b.slice(i + 1).toLowerCase(); }
function resolvePath(base, rel){
  if(rel.charAt(0) === '/') return rel.replace(/^\/+/, '');
  var parts = (base ? base.split('/') : []).concat(rel.split('/'));
  var out = [];
  for(var i = 0; i < parts.length; i++){
    var s = parts[i];
    if(s === '' || s === '.') continue;
    if(s === '..'){ if(out.length && out[out.length-1] !== '..') out.pop(); else out.push('..'); }
    else out.push(s);
  }
  return out.join('/');
}
function splitHash(href){
  var i = href.indexOf('#');
  return i < 0 ? [href, null] : [href.slice(0, i), decodeURIComponent(href.slice(i + 1))];
}

}

function inlineMd(src){
  var codes = [];
  var s = String(src).replace(/(`+)([\s\S]*?)\1/g, function(m, f, c){
    codes.push(c.replace(/^ (.*) $/, '$1'));
    return '\u0001' + (codes.length - 1) + '\u0001';
  });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\s*\)/g, function(m, alt, src2){
    return '<img alt="' + alt + '" data-src="' + src2 + '">';
  });
  s = s.replace(/\[([^\]]*)\]\(\s*([^)\s]*)(?:\s+&quot;([^&]*)&quot;)?\s*\)/g, function(m, txt, href, title){
    return '<a href="' + href + '"' + (title ? ' title="' + title + '"' : '') + '>' + txt + '</a>';
  });
  s = s.replace(/&lt;(https?:\/\/[^\s&<>]+)&gt;/g, '<a href="$1">$1</a>');
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^\w*\\])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^\w_\\])__([^_\n]+)__(?!\w)/g, '$1<strong>$2</strong>');
  s = s.replace(/(^|[^\w_\\])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~([\s\S]+?)~~/g, '<del>$1</del>');
  s = s.replace(/\u0001(\d+)\u0001/g, function(m, i){ return '<code>' + esc(codes[+i]) + '</code>'; });
  return s;
}

function isFence(l){ return /^ {0,3}(`{3,}|~{3,})/.test(l); }
function isHeading(l){ return /^ {0,3}#{1,6}\s/.test(l); }
function isHr(l){ return /^ {0,3}([-*_])[ \t]*(\1[ \t]*){2,}$/.test(l); }
function isQuote(l){ return /^ {0,3}>/.test(l); }
function isListItem(l){ return /^ *([-*+]|\d+[.)])(\s+|$)/.test(l); }
function isTableSep(l){ return !!l && /^ {0,3}\|?[ :\-|]+$/.test(l) && l.indexOf('-') >= 0 && l.indexOf('|') >= 0; }
function isBlockStart(l, next){
  return isFence(l) || isHeading(l) || isHr(l) || isQuote(l) || isListItem(l) ||
         (l.indexOf('|') >= 0 && isTableSep(next));
}

function splitRow(row){
  row = row.trim().replace(/^\|/, '').replace(/\|$/, '');
  var cells = [], cur = '';
  for(var i = 0; i < row.length; i++){
    var ch = row.charAt(i);
    if(ch === '\\' && row.charAt(i + 1) === '|'){ cur += '|'; i++; continue; }
    if(ch === '|'){ cells.push(cur); cur = ''; continue; }
    cur += ch;
  }
  cells.push(cur);
  return cells.map(function(c){ return c.trim(); });
}

function renderTable(lines, ctx){
  var head = splitRow(lines[0]);
  var aligns = splitRow(lines[1]).map(function(c){
    if(/^:-+:$/.test(c)) return 'center';
    if(/^-+:$/.test(c)) return 'right';
    return '';
  });
  var html = '<table><thead><tr>';
  head.forEach(function(c, i){
    html += '<th' + (aligns[i] ? ' style="text-align:' + aligns[i] + '"' : '') + '>' + inlineMd(c) + '</th>';
  });
  html += '</tr></thead><tbody>';
  for(var r = 2; r < lines.length; r++){
    var cells = splitRow(lines[r]);
    html += '<tr>';
    for(var c2 = 0; c2 < head.length; c2++){
      html += '<td' + (aligns[c2] ? ' style="text-align:' + aligns[c2] + '"' : '') + '>' +
              inlineMd(cells[c2] === undefined ? '' : cells[c2]) + '</td>';
    }
    html += '</tr>';
  }
  return html + '</tbody></table>';
}

function collectList(lines, start){
  var i = start;
  while(i < lines.length){
    var l = lines[i];
    if(isListItem(l)){ i++; continue; }
    if(!l.trim()){
      var n = lines[i + 1];
      if(n && (isListItem(n) || /^ {2,}\S/.test(n))){ i++; continue; }
      break;
    }
    if(/^ {2,}\S/.test(l) && !isHeading(l) && !isHr(l)){ i++; continue; }
    break;
  }
  return i;
}

function renderList(ls, ctx){
  var first = ls[0].match(/^( *)([-*+]|\d+[.)])(\s*)/);
  var baseIndent = first[1].length;
  var ordered = /\d/.test(first[2]);
  var items = [], cur = null, curIndent = 0;
  for(var k = 0; k < ls.length; k++){
    var l = ls[k];
    var m = l.match(/^( *)([-*+]|\d+[.)])(\s+|$)(.*)$/);
    if(m && m[1].length <= baseIndent + 1){
      if(cur) items.push(cur);
      cur = [m[4]];
      curIndent = m[1].length + m[2].length + (m[3].length || 1);
      cur.indent = curIndent;
    } else if(cur){
      var lead = (l.match(/^ */) || [''])[0].length;
      cur.push(l.slice(Math.min(cur.indent, lead)));
    }
  }
  if(cur) items.push(cur);
  var body = items.map(function(it){
    var box = '';
    var tm = it[0].match(/^\[([ xX])\]\s+(.*)$/);
    if(tm){
      box = '<input class="task" type="checkbox" disabled' + (tm[1].toLowerCase() === 'x' ? ' checked' : '') + '>';
      it[0] = tm[2];
    }
    var content = mdBlocks(it, ctx);
    var single = content.match(/^<p>([\s\S]*)<\/p>$/);
    if(single && single[1].indexOf('<p>') < 0) content = single[1];
    else content = content.replace(/^<p>([\s\S]*?)<\/p>\n?/, '$1\n');
    return '<li>' + box + content + '</li>';
  }).join('');
  if(ordered){
    var st = first[2].replace(/\D/g, '');
    return '<ol' + (st && st !== '1' ? ' start="' + st + '"' : '') + '>' + body + '</ol>';
  }
  return '<ul>' + body + '</ul>';
}

/* ========================= graficos ========================= */
/* Bloque ```chart: cabeceras `clave: valor` + filas `etiqueta | n | n | n`.
   type: progress -> barra apilada (cerradas | en revision | pendientes)
   type: bars     -> barras horizontales, tono por etapa (done/review/p3/p2/p1) */
var CHART_KEYS = ['type', 'title', 'hero', 'hero_label', 'legend', 'max', 'note'];

function chartData(lines){
  var head = {}, rows = [];
  for(var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if(!l) continue;
    var kv = l.match(/^([A-Za-z_]+)\s*:\s*(.*)$/);
    if(kv && CHART_KEYS.indexOf(kv[1].toLowerCase()) >= 0){ head[kv[1].toLowerCase()] = kv[2].trim(); continue; }
    if(l.indexOf('|') >= 0) rows.push(l.split('|').map(function(c){ return c.trim(); }));
  }
  return { head: head, rows: rows };
}

function chartTone(name){ return /^[a-z0-9]+$/.test(name || '') ? name : 'p1'; }

function renderChart(lines){
  var d = chartData(lines), head = d.head, rows = d.rows;
  var html = '<div class="chart">';
  if(head.title) html += '<div class="chart-title">' + esc(head.title) + '</div>';
  if(head.hero){
    html += '<div class="chart-hero"><b>' + esc(head.hero) + '</b>' +
            (head.hero_label ? '<span>' + esc(head.hero_label) + '</span>' : '') + '</div>';
  }
  if((head.type || 'bars').toLowerCase() === 'progress'){
    var names = (head.legend || 'Cerradas|En revisión|Pendientes').split('|');
    html += '<div class="chart-legend">' +
            '<span><i class="fill-done"></i>' + esc(names[0] || '') + '</span>' +
            '<span><i class="fill-review"></i>' + esc(names[1] || '') + '</span>' +
            '<span><i class="fill-track"></i>' + esc(names[2] || '') + '</span></div>';
    rows.forEach(function(r){
      var done = +r[1] || 0, rev = +r[2] || 0, pend = +r[3] || 0, tot = done + rev + pend;
      if(tot <= 0) return;
      var pd = done / tot * 100, pr = rev / tot * 100;
      var tip = r[0] + ' — ' + done + ' ' + (names[0] || '') + ', ' + rev + ' ' + (names[1] || '') +
                ', ' + pend + ' ' + (names[2] || '') + ' · total ' + tot;
      html += '<div class="crow' + (r[4] === 'total' ? ' total' : '') + '" title="' + esc(tip) + '">' +
              '<span class="clabel">' + esc(r[0]) + '</span><span class="ctrack">' +
              (done ? '<span class="cseg fill-done" style="width:' + pd.toFixed(1) + '%"></span>' : '') +
              (rev ? '<span class="cseg fill-review" style="width:' + pr.toFixed(1) + '%"></span>' : '') +
              '</span><span class="cval">' + Math.round((done + rev) / tot * 100) + '% listo · ' +
              (done + rev) + '/' + tot + '</span></div>';
    });
  } else {
    var max = +head.max || 0;
    rows.forEach(function(r){ max = Math.max(max, +r[1] || 0); });
    rows.forEach(function(r){
      var v = +r[1] || 0, w = max ? v / max * 100 : 0;
      html += '<div class="crow" title="' + esc(r[0] + ' — ' + v) + '">' +
              '<span class="clabel">' + esc(r[0]) + '</span>' +
              '<span class="cbar"><span class="cfill fill-' + esc(chartTone(r[2])) +
              '" style="width:' + w.toFixed(1) + '%"></span></span>' +
              '<span class="cval">' + esc(String(v)) + '</span></div>';
    });
  }
  if(head.note) html += '<p class="chart-note">' + inlineMd(head.note) + '</p>';
  return html + '</div>';
}

function mdBlocks(lines, ctx){
  var out = [], i = 0, m;
  while(i < lines.length){
    var line = lines[i];
    if(!line.trim()){ i++; continue; }

    if((m = line.match(/^ {0,3}(`{3,}|~{3,})\s*([^\s`]*)/))){
      var fenceCh = m[1].charAt(0), lang = m[2] || '', buf = [];
      var closer = new RegExp('^ {0,3}' + (fenceCh === '`' ? '`' : '~') + '{3,}\\s*$');
      i++;
      while(i < lines.length && !closer.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      if(lang === 'chart'){ out.push(renderChart(buf)); continue; }
      out.push('<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : '') +
               '><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }

    if((m = line.match(/^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/))){
      var lvl = m[1].length, text = m[2];
      var id = ctx.slug(slugify(text));
      ctx.toc.push({ level: lvl, text: text.replace(/[`*_]/g, ''), id: id });
      out.push('<h' + lvl + ' id="' + id + '"><a class="anchor" href="#' + id + '">#</a>' + inlineMd(text) + '</h' + lvl + '>');
      i++; continue;
    }

    if(isHr(line)){ out.push('<hr>'); i++; continue; }

    if(isQuote(line)){
      var qb = [];
      while(i < lines.length && (isQuote(lines[i]) || (lines[i].trim() && !isBlockStart(lines[i], lines[i+1])))){
        qb.push(lines[i].replace(/^ {0,3}> ?/, '')); i++;
      }
      out.push('<blockquote>' + mdBlocks(qb, ctx) + '</blockquote>');
      continue;
    }

    if(line.indexOf('|') >= 0 && isTableSep(lines[i + 1])){
      var tb = [lines[i], lines[i + 1]]; i += 2;
      while(i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0){ tb.push(lines[i]); i++; }
      out.push(renderTable(tb, ctx));
      continue;
    }

    if(isListItem(line)){
      var end = collectList(lines, i);
      out.push(renderList(lines.slice(i, end), ctx));
      i = end; continue;
    }

    var pb = [];
    while(i < lines.length && lines[i].trim() && !isBlockStart(lines[i], lines[i + 1])){ pb.push(lines[i]); i++; }
    if(!pb.length){ pb.push(lines[i]); i++; }
    out.push('<p>' + inlineMd(pb.join('\n')).replace(/ {2,}\n/g, '<br>\n') + '</p>');
  }
  return out.join('\n');
}

function newCtx(){
  var used = {};
  return {
    toc: [],
    slug: function(base){
      var s = base || 'seccion';
      if(used[s] === undefined){ used[s] = 0; return s; }
      used[s]++; return s + '-' + used[s];
    }
  };
}

function renderMarkdown(md){
  var ctx = newCtx();
  var body = String(md).replace(/\r\n?/g, '\n').replace(/\t/g, '    ');
  var fm = '';
  var fmm = body.match(/^---\n([\s\S]*?)\n---\n?/);
  if(fmm){
    fm = '<details class="frontmatter"><summary>▸ metadatos del documento</summary>' +
         highlightYaml(fmm[1]) + '</details>';
    body = body.slice(fmm[0].length);
  }
  return { html: fm + '<div class="md">' + mdBlocks(body.split('\n'), ctx) + '</div>', toc: ctx.toc };
}

/* ========================= yaml / csv ========================= */
function highlightYaml(src){
  var lines = esc(String(src).replace(/\r\n?/g, '\n')).split('\n').map(function(l){
    if(/^\s*#/.test(l)) return '<span class="y-com">' + l + '</span>';
    var m = l.match(/^(\s*(?:- )?)([A-Za-z0-9_.\-\/ ]+?)(:)(\s?)(.*)$/);
    if(m){
      var val = m[5], com = '';
      var ci = val.indexOf(' #');
      if(ci >= 0){ com = '<span class="y-com">' + val.slice(ci) + '</span>'; val = val.slice(0, ci); }
      var cls = /^(true|false|null|~|\d[\d.:\-]*)$/.test(val.trim()) ? 'y-num' : 'y-val';
      var vh = val.trim() ? '<span class="' + cls + '">' + val + '</span>' : val;
      return m[1] + '<span class="y-key">' + m[2] + '</span>' + m[3] + m[4] + vh + com;
    }
    return l;
  });
  return '<pre class="code" data-lang="yaml"><code>' + lines.join('\n') + '</code></pre>';
}

function renderYamlDoc(src){
  var ctx = newCtx();
  var out = [], lines = String(src).replace(/\r\n?/g, '\n').split('\n'), chunk = [];
  function flush(){ if(chunk.length){ out.push(highlightYaml(chunk.join('\n'))); chunk = []; } }
  for(var i = 0; i < lines.length; i++){
    var l = lines[i];
    var m = l.match(/^([a-zA-Z0-9_\-]+):\s*$/);
    if(m){
      flush();
      var id = ctx.slug(slugify(m[1]));
      ctx.toc.push({ level: 2, text: m[1], id: id });
      out.push('<h2 id="' + id + '"><a class="anchor" href="#' + id + '">#</a><code>' + esc(m[1]) + ':</code></h2>');
      continue;
    }
    chunk.push(l);
  }
  flush();
  return { html: '<div class="md">' + out.join('\n') + '</div>', toc: ctx.toc };
}

function parseCsv(text){
  var rows = [], row = [], cur = '', q = false;
  text = String(text).replace(/\r\n?/g, '\n');
  for(var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if(q){
      if(c === '"'){ if(text.charAt(i + 1) === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if(c === '"'){ q = true; }
    else if(c === ','){ row.push(cur); cur = ''; }
    else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length > 1 || (r[0] || '').trim() !== ''; });
}

function renderCsvDoc(src){
  var rows = parseCsv(src);
  if(!rows.length) return { html: '<div class="md"><p>Archivo vacío.</p></div>', toc: [] };
  var head = rows[0];
  var html = '<div class="md"><div class="csv-info">' + (rows.length - 1) + ' filas · ' + head.length + ' columnas</div><table><thead><tr>';
  head.forEach(function(h){ html += '<th>' + esc(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  for(var r = 1; r < rows.length; r++){
    html += '<tr>';
    for(var c = 0; c < head.length; c++) html += '<td>' + esc(rows[r][c] === undefined ? '' : rows[r][c]) + '</td>';
    html += '</tr>';
  }
  return { html: html + '</tbody></table></div>', toc: [] };
}

function renderContent(path, src){
  var e = ext(path);
  if(e === 'md' || e === 'markdown') return renderMarkdown(src);
  if(e === 'yaml' || e === 'yml') return renderYamlDoc(src);
  if(e === 'csv') return renderCsvDoc(src);
  return { html: '<div class="md"><pre class="code"><code>' + esc(src) + '</code></pre></div>', toc: [] };
}

/* ========================= sidebar ========================= */
function buildSidebar(){
  var html = '<div class="side-title">' + esc(LABELS.featured) + '</div>';
  PRIMARY.forEach(function(p){

            '<span class="sub">' + esc(p.desc) + '</span></span></a>';
  });

  var groups = {}, paths = Object.keys(FILES).filter(function(p){ return !FILES[p].v; }).sort();
  paths.forEach(function(p){
    var d = dirname(p);
    (groups[d] = groups[d] || []).push(p);
  });
  html += '<div class="side-title" style="margin-top:14px">' + esc(LABELS.all_documents) + '</div>';
  Object.keys(groups).sort(function(a, b){

  }).forEach(function(d){

    html += '<details class="group"' + open + '><summary>' + esc(d ? d + '/' : 'Raíz') +
            '<span class="count">' + groups[d].length + '</span></summary>';
    groups[d].forEach(function(p){
      html += '<a class="nav-item" data-path="' + esc(p) + '" href="#' + esc(p) + '" title="' + esc(p) + '">' +
              esc(basename(p)) + '</a>';
